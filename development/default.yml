# 開発用 Misskey 設定
#
# このファイルは development/compose.yml の web コンテナに
# /misskey/.config/default.yml として直接マウントされる。
# 詳細な設定項目は .config/example.yml を参照。
#
# ホスト側で pnpm dev する場合は db.host / redis.host を localhost に書き換える。

url: http://localhost:3000

port: 3000

db:
  host: db
  port: 5432
  db: misskey
  user: misskey
  pass: misskey

dbReplications: false

redis:
  host: redis
  port: 6379

id: 'aidx'