---
name: Dockle

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  dockle:
    runs-on: ubuntu-latest
    env:
      DOCKER_CONTENT_TRUST: 1
      DOCKLE_VERSION: 0.4.15

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Download and install dockle v${{ env.DOCKLE_VERSION }}
        run: |
          curl -L -o dockle.deb "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.deb"
          sudo dpkg -i dockle.deb

      - run: |
          cp .config/docker_example.env .config/docker.env
          cp ./compose_example.yml ./compose.yml

      - run: |
          docker compose up -d web
          echo "Docker compose services status:"
          docker compose ps
          echo "Getting images for web service..."
          IMAGES_JSON=$(docker compose images --format json web)
          echo "Images JSON: $IMAGES_JSON"
          if [ "$IMAGES_JSON" != "[]" ] && [ "$IMAGES_JSON" != "" ]; then
            IMAGE_ID=$(echo "$IMAGES_JSON" | jq -r '.[0].ID')
            echo "Image ID: $IMAGE_ID"
            if [ "$IMAGE_ID" != "null" ] && [ "$IMAGE_ID" != "" ]; then
              docker tag "${IMAGE_ID}" misskey-web:latest
              echo "Successfully tagged image as misskey-web:latest"
            else
              echo "Error: Image ID is null or empty"
              exit 1
            fi
          else
            echo "Error: No web service image found!"
            echo "Available services:"
            docker compose config --services
            exit 1
          fi

      - name: Prune docker junk (optional but recommended)
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Save image for Dockle
        run: |
          docker save misskey-web:latest -o ./misskey-web.tar
          ls -lh ./misskey-web.tar

      - name: Run Dockle with tar input
        run: |
          dockle --exit-code 1 --input ./misskey-web.tar

